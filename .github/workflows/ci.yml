name: CI

on:
    push:
        branches:
            - "*"
    pull_request:
        branches:
            - main

jobs:
    test:
        name: "Testing"
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - name: Installing dependencies
              run: |
                  pip install uv
                  uv sync --dev
                  uv run poe set-dev

            - name: Validating typing
              run: uv run poe types

            - name: Validating formatting
              run: uv run poe check
