name: Tests

on:
    push:
        branches:
            - "*"
    pull_request:
        branches:
            - main
            - develop

jobs:
    code_qa:
        name: Code quality assurance testing

        runs-on: ubuntu-latest

        steps:
            - name: Doing checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

            - name: Reading Python version
              id: pyver
              run: |
                  echo "version=$(cat .python-version)" >> "$GITHUB_OUTPUT"

            - name: Setting up Python
              uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
              with:
                  python-version: ${{ steps.pyver.outputs.version }}

            - name: Installing `uv`
              run: pip install uv

            - name: Syncing dependencies
              run: uv sync --dev --frozen

            - name: Validating typing
              run: uv run poe types

            - name: Validating formatting
              run: uv run poe check
